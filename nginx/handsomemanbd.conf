# ============================================
# HANDSOMEMANBD.COM - NGINX CONFIGURATION
# Handsome Man storefront (full brand site)
# Proxies to TrustCart frontend (localhost:3000)
# Next.js middleware maps this host -> /hm/* pages
# Backend  -> shared TrustCart backend (CORS handled by NestJS)
# ============================================
#
# BEFORE ENABLING SSL BLOCK:
#   1. Point DNS A records (@ and www) to this server
#   2. Deploy this file WITHOUT the 443 block first (or use the temporary
#      HTTP-only block below), then run:
#        sudo certbot --nginx -d handsomemanbd.com -d www.handsomemanbd.com
#      Certbot rewrites the config with the certificate paths.
#
# Standard flow used for the other brand domains applies here too.

# ── FRONTEND (Handsome Man storefront) ─────
server {
    listen 443 ssl;
    server_name handsomemanbd.com www.handsomemanbd.com;

    ssl_certificate     /etc/letsencrypt/live/handsomemanbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handsomemanbd.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ── HTTP -> HTTPS REDIRECT ─────────────────
server {
    listen 80;
    server_name handsomemanbd.com www.handsomemanbd.com;
    return 301 https://$host$request_uri;
}
